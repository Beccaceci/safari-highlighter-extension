<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: macOS Creative Sunset Violet-Gold -->
    <linearGradient id="highlighter-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF"/>
      <stop offset="50%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>

    <filter id="highlighter-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#240046" flood-opacity="0.38"/>
    </filter>

    <linearGradient id="glass-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Marker Chisel Tip Glow -->
    <linearGradient id="marker-tip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
  </defs>

  <!-- iOS / macOS Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#highlighter-bg)" filter="url(#highlighter-shadow)"/>
  
  <!-- Subtle Top Specular Sheen -->
  <rect x="32" y="32" width="448" height="224" rx="104" fill="url(#glass-highlight)"/>

  <!-- Background Web Document Lines (Abstracted page content) -->
  <rect x="110" y="140" width="160" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.25"/>
  <rect x="110" y="174" width="292" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.25"/>
  <rect x="110" y="208" width="220" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.25"/>

  <!-- Radiant Neon Highlight Ribbon Swipe -->
  <path d="M 96 290 Q 220 270 340 300 Q 400 315 420 305" fill="none" stroke="#FFD166" stroke-width="42" stroke-linecap="round" stroke-opacity="0.88"/>
  <path d="M 96 290 Q 220 270 340 300 Q 400 315 420 305" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Isometric Marker / Stylus Pen -->
  <g transform="translate(230, 90) rotate(38)">
    <!-- Pen Body -->
    <rect x="-24" y="0" width="48" height="160" rx="12" fill="#FFFFFF"/>
    <!-- Pen Grip Ring -->
    <rect x="-24" y="120" width="48" height="20" fill="#3A0CA3"/>
    <!-- Chisel Tip -->
    <path d="M -20 160 L 20 160 L 10 205 L -20 190 Z" fill="url(#marker-tip)"/>
  </g>

  <!-- Precision Star / Sparkle Indicator -->
  <g transform="translate(136, 120) scale(0.9)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>
</svg>
